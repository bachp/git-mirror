name: CI

on:
  pull_request:       # trigger on pull requests
  push:
    branches:         # array of glob patterns matching against refs/heads. Optional; defaults to all
      - master        # triggers on pushes that contain changes in master

jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        build: [linux, macos, windows]
        include:
          - build: linux
            os: ubuntu-latest
            rust: stable
          - build: macos
            os: macos-latest
            rust: stable
          - build: windows
            os: windows-latest
            rust: stable
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup rust toolchain
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal --no-self-update --override

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-provider: github
          cache-bin: "false"
          save-if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}

      - name: Run cargo test
        run: cargo test

      - name: Build release binary
        run: cargo build --release

  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt --no-self-update --override

      - name: Check formatting
        run: cargo fmt -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup rust toolchain
        run: rustup toolchain install stable --profile minimal --component clippy --no-self-update --override

      - name: Run cargo clippy checks
        run: cargo clippy -- -D warnings

  docker:
    name: Build and push Docker image
    if: github.actor != 'dependabot[bot]'
    needs: build
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml

  nix:
    name: Build with nix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build
        run: nix build
