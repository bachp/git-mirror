name: Docker image

on: workflow_call

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build linux/${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push by digest
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Save image digest
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
          ARCH: ${{ matrix.arch }}
        run: |
          test -n "$DIGEST"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/$ARCH.digest"

      - uses: actions/upload-artifact@v7
        with:
          name: docker-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ matrix.arch }}.digest
          if-no-files-found: error
          overwrite: true

  publish:
    name: Publish multi-platform image
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: docker-digest-*
          path: digests
          merge-multiple: true

      - uses: rlespinasse/github-slug-action@v5
        with:
          short-length: 7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Publish image index
        run: |
          tags=(--tag "$IMAGE:$GITHUB_REF_POINT_SLUG")
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            tags+=(--tag "$IMAGE:latest")
          fi
          docker buildx imagetools create "${tags[@]}" \
            "$IMAGE@$(< digests/amd64.digest)" \
            "$IMAGE@$(< digests/arm64.digest)"
