version: 2
updates:
- package-ecosystem: cargo
  directory: "/"
  schedule:
    interval: daily
    time: "04:00"
  open-pull-requests-limit: 10
  groups:
    cargo-non-major:
      patterns: ["*"]
      update-types: ["minor", "patch"]
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
  groups:
    actions-non-major:
      patterns: ["*"]
      update-types: ["minor", "patch"]
